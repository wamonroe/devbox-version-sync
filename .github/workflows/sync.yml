name: Devbox Version Sync

# Reusable workflow. Moves each package in the caller's config to the newest
# version Devbox offers within its update policy, and bumps the files that pin
# it, in one pull request per package or group. If Devbox has nothing newer, or
# a check (such as a Docker image) isn't ready yet, it does nothing and the
# next run checks again.
#
# Releases beyond a package's policy (Ruby 4.1 when it follows 4.0.x) get an
# issue labelled `issue-label`, a callout on the pull request and a note in
# the run summary; run the caller's upgrade workflow to move to them. The
# issue is updated as newer versions appear and closed once there's nothing
# beyond the policy.
#
# While a run works on a group whose pull request is open, a notice at the top
# of that pull request asks people not to merge or push to it; the rebuilt
# description replaces it, or a final step removes it. If a run finds every
# package in a group already current (updated by hand, say), it closes that
# group's pull request.
#
# Commented `/devbox-version-sync rebuild` on a sync pull request (the
# caller runs this workflow on `issue_comment`), it rebuilds only that pull
# request's group on the default branch, reacting 👀 to the comment when it
# starts and 🚀 or 😕 when it's done. Only the repository's owner, members and
# collaborators can use it.
#
# The caller grants contents, issues and pull-requests write. Pull requests
# opened with the default GITHUB_TOKEN don't trigger CI, so pass a `token`
# secret (a fine-grained PAT with Contents and Pull requests write access) for
# them to. See README.md.

on:
  workflow_call:
    inputs:
      config:
        description: Path to the config file.
        type: string
        default: .github/devbox-version-sync.json
      assignees:
        description: Comma-separated GitHub users to assign pull requests and issues to.
        type: string
        default: ""
      upgrade-workflow:
        description: File name of the caller's upgrade workflow, linked from issues.
        type: string
        default: devbox_version_upgrade.yml
      issue-label:
        description: Label for issues about releases beyond a package's policy.
        type: string
        default: devbox-version-upgrade
      group:
        description: Update only this group (the part of its branch after devbox-version-sync/). Empty for every group; a rebuild command picks its pull request's.
        type: string
        default: ""
    secrets:
      token:
        description: Token for opening pull requests, so they trigger CI. Defaults to GITHUB_TOKEN.
        required: false

permissions:
  contents: read

jobs:
  list:
    name: List packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      groups: ${{ steps.list.outputs.groups }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up devbox-version-sync
        uses: wamonroe/devbox-version-sync@v1

      # A comment on an issue or pull request: act only on the rebuild
      # command, from someone with write access, on a sync pull request.
      # Anything else ends the run without updating, replying when it was
      # meant as a command.
      - name: Read the rebuild command
        id: command
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.comment.body }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
          COMMENT_ID: ${{ github.event.comment.id }}
          NUMBER: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request != null }}
          DEVBOX_VERSION_SYNC_CONFIG: ${{ inputs.config }}
        run: |
          react() { gh api -X POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content="$1" > /dev/null; }
          refuse() {
            react confused
            gh api "repos/$GH_REPO/issues/$NUMBER/comments" -f body="$1" > /dev/null
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$1"
            exit 0
          }

          read -r command action rest <<< "$(head -n 1 <<< "$BODY" | tr -d '\r')"
          if [[ $command != /devbox-version-sync || $IS_PR != true ]]; then
            echo "Not a rebuild command on a pull request."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case $ASSOCIATION in
            OWNER | MEMBER | COLLABORATOR) ;;
            *)
              echo "Ignoring a command from $ASSOCIATION (needs OWNER, MEMBER or COLLABORATOR)."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [[ $action != rebuild || -n $rest ]]; then
            refuse "Devbox Version Sync understands \`/devbox-version-sync rebuild\`, which rebuilds this pull request on the default branch."
          fi

          pr=$(gh pr view "$NUMBER" --json headRefName,isCrossRepository,state)
          branch=$(jq -r .headRefName <<< "$pr")
          if [[ $(jq -r .isCrossRepository <<< "$pr") == true || $branch != devbox-version-sync/* ]]; then
            refuse "\`/devbox-version-sync rebuild\` only works on pull requests Devbox Version Sync opened (branches named \`devbox-version-sync/<group>\`)."
          fi
          if [[ $(jq -r .state <<< "$pr") != OPEN ]]; then
            refuse "This pull request isn't open, so there's nothing to rebuild."
          fi
          group=${branch#devbox-version-sync/}
          if ! devbox-version-sync list "$group" > /dev/null; then
            refuse "The config has no update group \`$group\` anymore, so this pull request can't be rebuilt. Close it, and the weekly run opens any update that's still needed."
          fi

          react eyes
          echo "Rebuilding #$NUMBER ($group)."
          echo "group=$group" >> "$GITHUB_OUTPUT"

      - name: List update groups
        id: list
        if: steps.command.outputs.skip != 'true'
        env:
          DEVBOX_VERSION_SYNC_CONFIG: ${{ inputs.config }}
          GROUP: ${{ steps.command.outputs.group || inputs.group }}
        run: echo "groups=$(devbox-version-sync list "$GROUP")" >> "$GITHUB_OUTPUT"

  update:
    name: Update ${{ matrix.group.name }}
    needs: list
    if: needs.list.outputs.groups != '[]' && needs.list.outputs.groups != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.list.outputs.groups) }}
    env:
      DEVBOX_VERSION_SYNC_CONFIG: ${{ inputs.config }}
      PACKAGES: ${{ join(matrix.group.packages, ' ') }}
      BRANCH: devbox-version-sync/${{ matrix.group.name }}
      GH_REPO: ${{ github.repository }}
      NOTICE_START: "<!-- devbox-version-sync:updating -->"
      NOTICE_END: "<!-- /devbox-version-sync:updating -->"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Mark the open pull request as being updated
        id: notice
        # A notice is a courtesy; failing to post one shouldn't stop the update.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          number=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          echo "number=$number" >> "$GITHUB_OUTPUT"
          if [[ -z $number ]]; then
            echo "No open pull request for $BRANCH."
            exit 0
          fi

          # Drop a notice a killed run left behind, then put this run's on top.
          body=$(gh pr view "$number" --json body --jq .body |
            perl -0pe 's/\Q$ENV{NOTICE_START}\E.*?\Q$ENV{NOTICE_END}\E\n*//gs')
          notice="$NOTICE_START
          > [!NOTE]
          > Devbox Version Sync is updating this pull request ([run]($RUN_URL)). Please don't merge or push to it until this notice goes away: the update may replace the branch.
          $NOTICE_END"
          gh pr edit "$number" --body "$notice"$'\n\n'"$body"
          echo "Marked #$number as being updated."

      - name: Install Devbox
        uses: jetify-com/devbox-install-action@v0.16.0
        with:
          enable-cache: true

      - name: Set up devbox-version-sync
        uses: wamonroe/devbox-version-sync@v1

      - name: Update within each package's policy
        id: update
        run: |
          read -ra packages <<< "$PACKAGES"
          result=$RUNNER_TEMP/result.json
          export DEVBOX_VERSION_SYNC_STATUS_FILE=$RUNNER_TEMP/status.tsv
          : > "$DEVBOX_VERSION_SYNC_STATUS_FILE"
          devbox-version-sync update "${packages[@]}" > "$result"
          if [[ $(jq length "$result") -eq 0 ]]; then
            echo "Nothing to update for ${packages[*]}."
            # Every package already current (or auto: none) means an open
            # pull request for the group isn't needed. One waiting on a
            # check, or pinned ahead of Devbox, keeps it open.
            if ! awk -F '\t' '$2 != "current" && $2 != "none" { found = 1 } END { exit !found }' "$DEVBOX_VERSION_SYNC_STATUS_FILE"; then
              echo "current=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          pr=$(devbox-version-sync describe bump "$result")
          delimiter=$(cat /proc/sys/kernel/random/uuid)
          {
            echo "update=true"
            echo "title=$(jq -r .title <<< "$pr")"
            echo "paths<<$delimiter"
            jq -r .paths <<< "$pr"
            echo "$delimiter"
            echo "body<<$delimiter"
            jq -r .body <<< "$pr"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Track releases beyond each package's policy
        id: upgrade
        # A Devbox hiccup here shouldn't stop the pull request, or close an issue.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ inputs.issue-label }}
          ASSIGNEES: ${{ inputs.assignees }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/${{ inputs.upgrade-workflow }}
        run: |
          read -ra packages <<< "$PACKAGES"
          assign=()
          if [[ -n $ASSIGNEES ]]; then assign=(--assignee "$ASSIGNEES"); fi
          alerts=""
          status=0

          for pkg in "${packages[@]}"; do
            if ! version=$(devbox-version-sync upgrade-available "$pkg"); then
              echo "::warning::Couldn't check $pkg for releases beyond its policy. Leaving its issue as it is."
              status=1
              continue
            fi
            info=$(devbox-version-sync info "$pkg")
            name=$(jq -r .name <<< "$info")
            auto=$(jq -r .auto <<< "$info")
            follows=$(jq -r '.follows // empty' <<< "$info")
            marker="<!-- devbox-version-upgrade:$pkg -->"
            number=$(MARKER=$marker gh issue list --label "$LABEL" --state open --limit 100 --json number,body \
              --jq '[.[] | select(.body | contains(env.MARKER)) | .number] | first // empty')

            if [[ -z $version ]]; then
              echo "No release of $pkg beyond its policy (auto: $auto)."
              if [[ -n $number ]]; then
                gh issue close "$number" --reason completed \
                  --comment "Devbox offers nothing newer for $name than its \`auto: $auto\` policy covers. Closing."
              fi
              continue
            fi

            if [[ -n $follows ]]; then
              policy="Automatic updates for \`$pkg\` follow $follows (\`auto: $auto\`)"
            else
              policy="Automatic updates for \`$pkg\` are off (\`auto: none\`)"
            fi
            files=$(jq -r '["devbox.json"] + .files | .[] | "- `\(.)`"' <<< "$info")
            title="Upgrade $name to $version"
            body="$marker
          Devbox now offers **$name $version**. $policy, so this one needs a deliberate upgrade.

          To upgrade, run the [Devbox Version Upgrade]($WORKFLOW_URL) workflow for \`$pkg\`. It opens a pull request that updates these together:

          $files

          The weekly Devbox Version Sync workflow keeps this issue up to date and closes it once there's nothing newer than the policy covers. Merging the upgrade pull request also closes it."

            if [[ -n $number ]]; then
              gh issue edit "$number" --title "$title" --body "$body"
            else
              gh label create "$LABEL" --force --color 1D76DB \
                --description "A release beyond a package's Devbox update policy is available"
              url=$(gh issue create --title "$title" --body "$body" --label "$LABEL" "${assign[@]}")
              number=${url##*/}
            fi

            alert="> [!IMPORTANT]
          > **$name $version is available.** $policy, so it needs a deliberate upgrade: run the [Devbox Version Upgrade]($WORKFLOW_URL) workflow for \`$pkg\`. Tracked in #$number."
            echo "::notice::$name $version is available beyond its policy. Run the Devbox Version Upgrade workflow to upgrade."
            echo "$alert" >> "$GITHUB_STEP_SUMMARY"
            alerts+="$alert"$'\n\n'
          done

          delimiter=$(cat /proc/sys/kernel/random/uuid)
          {
            echo "alerts<<$delimiter"
            echo "$alerts"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Open pull request
        if: steps.update.outputs.update == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.token || github.token }}
          branch: devbox-version-sync/${{ matrix.group.name }}
          delete-branch: true
          add-paths: ${{ steps.update.outputs.paths }}
          commit-message: ${{ steps.update.outputs.title }}
          title: ${{ steps.update.outputs.title }}
          assignees: ${{ inputs.assignees }}
          body: |
            ${{ steps.upgrade.outputs.alerts }}${{ steps.update.outputs.body }}

            Opened by the [Devbox Version Sync](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) workflow.

      - name: Close the pull request if it's no longer needed
        if: steps.update.outcome == 'success' && steps.update.outputs.current == 'true' && steps.notice.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.notice.outputs.number }}
        run: |
          read -ra packages <<< "$PACKAGES"
          versions=$(for pkg in "${packages[@]}"; do devbox-version-sync info "$pkg"; done |
            jq -rs 'map("\(.name) \(.version)") | join(", ")')
          gh pr close "$NUMBER" --delete-branch \
            --comment "\`devbox.lock\` on the default branch is already at the newest version Devbox offers within each package's policy ($versions), so this pull request isn't needed anymore. Closing."

      - name: Remove the update notice
        # Also after a failure or cancellation, so the notice doesn't linger.
        if: always() && steps.notice.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ steps.notice.outputs.number }}
        run: |
          body=$(gh pr view "$NUMBER" --json body --jq .body)
          if [[ $body != *"$NOTICE_START"* ]]; then
            echo "#$NUMBER has no update notice (its description was rebuilt)."
            exit 0
          fi
          body=$(perl -0pe 's/\Q$ENV{NOTICE_START}\E.*?\Q$ENV{NOTICE_END}\E\n*//gs' <<< "$body")
          gh pr edit "$NUMBER" --body "$body"
          echo "Removed the update notice from #$NUMBER."

      - name: Report back on the rebuild command
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: ${{ github.event.comment.id }}
          REACTION: ${{ job.status == 'success' && 'rocket' || 'confused' }}
        run: gh api -X POST "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content="$REACTION" > /dev/null
